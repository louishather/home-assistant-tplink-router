name: "Release"

on:
  release:
    types:
      - "published"
  # Fork: pushing a version tag (e.g. 2.47.0-lh.1) creates the release with the ZIP HACS installs
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name || github.ref_name }}"' \
            "${{ github.workspace }}/custom_components/tplink_router/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/tplink_router"
          zip tplink_router.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ github.workspace }}/custom_components/tplink_router/tplink_router.zip
